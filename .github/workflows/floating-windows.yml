name: Floating chat · Windows x64

on:
  workflow_dispatch:
  push:
    tags: ['floating-*']

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci --registry=https://registry.npmjs.org --replace-registry-host=always
      - run: npm run build:swift
      - run: npm run package:check
      - run: npm run icons:check
      - run: npx tsc --noEmit
      - run: npx tauri build --bundles nsis
      - name: Verify installer and compute SHA-256
        shell: pwsh
        run: |
          $files = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($files.Count -ne 1) { throw "Expected one x64 NSIS installer" }
          $file = $files[0]
          # Release uploads normalize spaces to dots. Hash the published filename.
          if ($file.Name.Contains(' ')) {
            $file = Rename-Item -LiteralPath $file.FullName -NewName ($file.Name.Replace(' ', '.')) -PassThru
          }
          $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($file.Name)" | Set-Content "$($file.DirectoryName)/SHA256SUMS.txt" -Encoding ascii
      - name: Test a clean install on the disposable Windows runner
        shell: pwsh
        run: |
          $installer = (Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe).FullName
          $dest = Join-Path $env:RUNNER_TEMP 'KivioInstall'
          $p = Start-Process $installer -ArgumentList '/S', "/D=$dest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer exited $($p.ExitCode)" }
          $binary = Join-Path $dest 'kivio.exe'
          if (!(Test-Path $binary -PathType Leaf)) { throw "Missing installed executable: $binary" }
          $p = Start-Process $binary -PassThru
          if ($p.WaitForExit(10000)) { throw "Kivio exited at startup: $($p.ExitCode)" }
          Stop-Process -Id $p.Id
      - uses: actions/upload-artifact@v4
        with:
          name: Kivio-floating-chat-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error

  release:
    needs: installer
    if: startsWith(github.ref, 'refs/tags/floating-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Kivio-floating-chat-windows-x64
          path: installer
      - name: Publish tested installer from this tag
        working-directory: installer
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          sha256sum --check SHA256SUMS.txt
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Kivio 悬浮对话 · $TAG (Windows x64)" \
            --notes '下载下方的 setup.exe。先退出托盘中的 Kivio，并备份 %APPDATA%\com.zmair.kivio。沿用原版的模型设置和聊天历史。默认 Ctrl+Shift+G 框选，再次截图追加到同一输入框。' \
            ./*-setup.exe SHA256SUMS.txt
